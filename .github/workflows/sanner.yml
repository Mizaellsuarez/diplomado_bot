name: Automated Market Scanner

on:
  schedule:
    # Lunes a viernes a las 22:00 UTC
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

# El escaner necesita guardar cambios en data/ en el repositorio.
permissions:
  contents: write

# Evita que dos ejecuciones automaticas publiquen datos a la vez.
concurrency:
  group: automated-market-scanner-main
  cancel-in-progress: false

jobs:
  run-scanner:
    # Version fija para evitar cambios inesperados de ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configurar entorno Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar escaner cuantitativo
        run: python src/scanner.py

      - name: Sincronizar datos actualizados en el repositorio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/latest_market_scan.json data/signals_log.csv

          if git diff --cached --quiet; then
            echo "No hay cambios en los datos. No se requiere commit."
            exit 0
          fi

          git commit -m "Actualizacion automatica de senales de mercado [skip ci]"
          git push origin HEAD:main